framework:
    rate_limiter:
        # General API limiter: 60 requests per sliding window of 1 minute.
        portal_api:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Auth endpoint limiter: 5 attempts per sliding window of 15 minutes.
        auth_login:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
