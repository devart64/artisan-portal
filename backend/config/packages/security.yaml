security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        admin_provider:
            memory:
                users:
                    '%env(ADMIN_USERNAME)%':
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_SUPER_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        admin:
            pattern: ^/admin/
            stateless: false
            provider: admin_provider
            http_basic:
                realm: 'Artisan Portal Admin'

        portal:
            pattern: ^/api/portal/
            stateless: true
            custom_authenticators:
                - App\Security\ClientTokenAuthenticator

        api:
            pattern: ^/api/
            stateless: true
            jwt: ~
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/admin/, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/portal/, roles: PUBLIC_ACCESS }
        - { path: ^/api/stripe/webhook$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/webhooks/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }
