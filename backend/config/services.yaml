parameters:
    # Default allowed CORS origin. Override via the CORS_ALLOW_ORIGIN env var
    # (e.g. https://app.artisan-portal.fr in production). Wildcard suits dev.
    env(CORS_ALLOW_ORIGIN): '*'
    # Default lock store used by the rate limiters. 'flock' uses local files,
    # which is fine for a single node; use a shared store (redis/postgres) when
    # running multiple instances.
    env(LOCK_DSN): 'flock'
    frontend_url: '%env(FRONTEND_URL)%'
    aws_region: '%env(AWS_REGION)%'
    aws_bucket: '%env(AWS_BUCKET)%'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    twilio_account_sid: '%env(TWILIO_ACCOUNT_SID)%'
    twilio_auth_token: '%env(TWILIO_AUTH_TOKEN)%'
    twilio_phone_number: '%env(TWILIO_PHONE_NUMBER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    aws_s3_client:
        class: Aws\S3\S3Client
        arguments:
            -   version: 'latest'
                region: '%env(AWS_REGION)%'
                credentials:
                    key: '%env(AWS_ACCESS_KEY_ID)%'
                    secret: '%env(AWS_SECRET_ACCESS_KEY)%'

    Aws\S3\S3Client: '@aws_s3_client'

    App\Service\FileUploadService:
        arguments:
            $awsRegion: '%env(AWS_REGION)%'
            $awsBucket: '%env(AWS_BUCKET)%'

    App\Service\MagicLinkService:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\Service\NotificationService:
        arguments:
            $twilioAccountSid: '%env(TWILIO_ACCOUNT_SID)%'
            $twilioAuthToken: '%env(TWILIO_AUTH_TOKEN)%'
            $twilioPhoneNumber: '%env(TWILIO_PHONE_NUMBER)%'

    App\Service\AiService:
        arguments:
            $anthropicApiKey: '%env(ANTHROPIC_API_KEY)%'

    App\Command\SendDocumentRemindersCommand:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\Service\StripeService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'
            $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'
            $stripePriceStarter: '%env(STRIPE_PRICE_STARTER)%'
            $stripePricePro: '%env(STRIPE_PRICE_PRO)%'
            $stripePriceBusiness: '%env(STRIPE_PRICE_BUSINESS)%'

    App\Service\PushService:
        arguments:
            $vapidPublicKey:  '%env(VAPID_PUBLIC_KEY)%'
            $vapidPrivateKey: '%env(VAPID_PRIVATE_KEY)%'
            $vapidSubject:    '%env(VAPID_SUBJECT)%'

    App\Controller\PushController:
        arguments:
            $vapidPublicKey: '%env(VAPID_PUBLIC_KEY)%'

    App\EventSubscriber\CorsSubscriber:
        arguments:
            $corsAllowOrigin: '%env(CORS_ALLOW_ORIGIN)%'
        tags:
            - { name: kernel.event_subscriber }

    App\State\TenantAwareProcessor:
        arguments:
            $inner: '@api_platform.doctrine.orm.state.persist_processor'
        tags:
            - { name: api_platform.state_processor }
