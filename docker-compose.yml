services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artisan_portal
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
