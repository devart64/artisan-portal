services:

  # ── Base de données ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artisan_portal
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisan -d artisan_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Cache ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ── Emails (dev) ─────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web → http://localhost:8025

  # ── Backend PHP-FPM ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - jwt_keys:/app/config/jwt
    environment:
      APP_ENV: dev
      APP_SECRET: dev_secret_change_in_prod
      DATABASE_URL: postgresql://artisan:artisan@postgres:5432/artisan_portal?serverVersion=16&charset=utf8
      JWT_SECRET_KEY: /app/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/config/jwt/public.pem
      JWT_PASSPHRASE: artisan_jwt_passphrase
      MAILER_DSN: smtp://mailpit:1025
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOW_ORIGIN: "*"
      POSTGRES_DB: artisan_portal
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/docker/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (reverse proxy Symfony) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8001:80"     # API → http://localhost:8001
    volumes:
      - ./backend/public:/app/public:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3001:3000"   # App → http://localhost:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      API_URL: http://nginx
    depends_on:
      nginx:
        condition: service_started
      backend:
        condition: service_healthy
    entrypoint: ["/app/docker/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
  jwt_keys:
